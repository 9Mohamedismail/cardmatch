<!doctype html>
<html lang="en">
  <head>
    <title>CardMatch</title>
    <link rel="icon" type="image/x-icon" href="/logo.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" href="../style.css" />
    <script defer src="/scripts/header.js"></script>
    <script defer src="/scripts/card.js"></script>
  </head>

  <body>
    <header></header>

    <main id="card-content" class="card-info">
      <div class="image-container">
        <img id="image" src="" alt="" />
      </div>

      <div class="card-details">
        <h2 id="name"></h2>
        <p id="id"></p>
        <p id="issuer"></p>
        <p id="minCreditLevel"></p>
        <p id="annualFee"></p>
        <p id="rewardType"></p>
        <p id="bestCategories"></p>
        <p id="welcomeBonus"></p>
        <p id="description"></p>
        <h3>Pros</h3>
        <ul id="pros"></ul>
        <h3>Cons</h3>
        <ul id="cons"></ul>
      </div>
    </main>
  </body>
</html>
